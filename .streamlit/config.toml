# Streamlit theme: Nord light and Tokyo Night dark; both defined so the appearance toggle works.
[theme]
base = "dark"
baseRadius = "0.6rem"
font = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"

# Nord light (Snow Storm)
[theme.light]
backgroundColor = "#ECEFF4"
secondaryBackgroundColor = "#E5E9F0"
textColor = "#2E3440"
primaryColor = "#5E81AC"
linkColor = "#5E81AC"
borderColor = "#D8DEE9"

[theme.light.sidebar]
backgroundColor = "#E5E9F0"
borderColor = "#D8DEE9"

# Tokyo Night dark
[theme.dark]
backgroundColor = "#1A1B26"
secondaryBackgroundColor = "#24283B"
textColor = "#C0CAF5"
primaryColor = "#7AA2F7"
linkColor = "#7DCFFF"
borderColor = "#2F3549"
codeBackgroundColor = "#1F2335"

[theme.dark.sidebar]
backgroundColor = "#16161E"
borderColor = "#2F3549"

# Disable Streamlit's usage telemetry.
[browser]
gatherUsageStats = false
