[theme]
base = "dark"
baseRadius = "0.9rem"
font = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"

[theme.dark]
backgroundColor = "#0E1116"
secondaryBackgroundColor = "#151923"
textColor = "#E9ECF2"
primaryColor = "#7CA5EC"
linkColor = "#7CA5EC"
borderColor = "#262A31"
codeBackgroundColor = "#12151B"

[theme.dark.sidebar]
backgroundColor = "#12151B"
borderColor = "#262A31"

[theme.light]
backgroundColor = "#F2F3F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#171E29"
primaryColor = "#2D5FC4"
linkColor = "#2D5FC4"
borderColor = "#E2E5EA"

[theme.light.sidebar]
backgroundColor = "#F8F9FB"
borderColor = "#E2E5EA"

[browser]
gatherUsageStats = false
